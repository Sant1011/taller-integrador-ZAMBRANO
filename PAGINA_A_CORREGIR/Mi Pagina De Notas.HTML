<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de notas</title>
    <link rel="stylesheet" href="Estilos Del Sitio.CSS">
</head>
<body>

    <div class="contenedor">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label>Nota 1:</label>
        <input type="numero" id="nota1" step="0.1">

        <label>Nota 2:</label>
        <input type="numero" id="nota2" step="0.1">

        <label>Nota 3:</label>
        <input type="numero" id="nota3" step="0.1">

        <button onclick="calcular()">Calcular</button>

        <p id="resultado"></p>
        <p id="resultado2"></p>
    </div>

<script>

let TempValue2 = 0;
let x = 3;

function calcular() {

    let a = parseFloat(document.getElementById("nota1").value);
    let b = parseFloat(document.getElementById("nota2").value);
    let c = parseFloat(document.getElementById("nota3").value);


    if (isNaN(a) || isNaN(b) || isNaN(c)) {
        document.getElementById("resultado").innerHTML = "Debe ingresar las tres notas.";
        return;
    }

    TempValue2 = (a + b + c) / x;

    document.getElementById("resultado").innerHTML = "Promedio: " + TempValue2.toFixed(2);

    if (TempValue2 >= 3.0) {
        document.getElementById("resultado2").innerHTML = "Resultado: aprobado";
    } else {
        document.getElementById("resultado2").innerHTML = "Resultado: reprobado";
    }

}

// function calcularAntiguo(nota1, nota2) {
//     let suma = nota1 + nota2;
//     return suma / 2;
// }


</script>

</body>
</html>
